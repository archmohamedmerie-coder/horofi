<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعلان صحّح حروفك 1.91:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* لوحة إعلان 1200×628 (1.91:1) — النصّ يميناً، الصورتان يساراً */
  :root{
    --purple-1:#4c1d95; --purple-2:#6d28d9; --purple-3:#8b5cf6;
    --yellow:#f6b600; --ink:#2b1a4a; --green:#22c55e; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:628px;overflow:hidden;background:var(--purple-1)}
  body{
    font-family:'Tajawal',sans-serif;color:var(--white);position:relative;
    background:
      radial-gradient(420px 420px at 90% 10%, rgba(139,92,246,.55), transparent 70%),
      radial-gradient(460px 460px at 5% 100%, rgba(139,92,246,.45), transparent 70%),
      linear-gradient(160deg, var(--purple-1) 0%, var(--purple-2) 55%, #3b1478 100%);
  }
  .ring{position:absolute;border-radius:50%;border:48px solid rgba(255,255,255,.05)}
  .ring.a{width:520px;height:520px;right:-200px;top:-260px}
  .ring.b{width:420px;height:420px;left:-180px;bottom:-200px}

  .hook{position:absolute;top:36px;right:36px;width:560px;padding:22px 32px 18px;
    background:var(--yellow);color:var(--ink);border-radius:34px;
    font-weight:900;font-size:36px;line-height:1.28;
    box-shadow:0 14px 32px rgba(0,0,0,.28)}
  .hook::after{content:"";position:absolute;bottom:-20px;right:90px;
    border:20px solid transparent;border-top-color:var(--yellow);border-bottom:0}

  .benefit{position:absolute;top:270px;right:40px;width:580px;text-align:right}
  .benefit .brand{font-weight:900;font-size:76px;line-height:1;text-shadow:0 6px 18px rgba(0,0,0,.4);
    display:flex;align-items:center;gap:18px;white-space:nowrap}
  .benefit .brand em{font-style:normal;color:var(--green)}
  .benefit .brand img{width:78px;height:78px;border-radius:18px;background:var(--white);padding:6px;
    box-shadow:0 10px 24px rgba(0,0,0,.3)}
  .benefit .line{font-weight:800;font-size:30px;line-height:1.3;margin-top:16px;white-space:nowrap;text-shadow:0 4px 14px rgba(0,0,0,.35)}

  .offer{position:absolute;right:44px;bottom:40px}
  .pill{background:var(--white);color:#b91c1c;font-weight:900;font-size:34px;line-height:1;
    padding:16px 30px;border-radius:999px;box-shadow:0 14px 30px rgba(0,0,0,.3)}

  .kids{position:absolute;left:36px;top:36px;width:340px;height:556px;border-radius:36px;
    background-image:url("poster-original.png");
    background-size:1531px 861px;background-position:-60px -110px;
    box-shadow:0 24px 50px rgba(0,0,0,.45);border:8px solid rgba(255,255,255,.9)}

  .phone{position:absolute;top:92px;left:352px;width:240px;height:428px;
    border-radius:34px;overflow:hidden;background:#000;
    border:10px solid #1a1030;box-shadow:0 30px 60px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.12);
    transform:rotate(-3deg)}
  .phone img{width:100%;height:auto;display:block;transform:translateY(-9%)}
</style>
</head>
<body>
  <div class="ring a"></div><div class="ring b"></div>

  <div class="hook">هل يعاني طفلك صعوبة في تغيُّر أشكال الحروف في الكلمة؟</div>

  <div class="benefit">
    <div class="brand"><img src="../img/icon.png" alt=""><span><em>صحّح</em> حروفك</span></div>
    <div class="line">يتعلّم أشكال الحروف باللعب<br>لأطفال 4 إلى 8 سنوات</div>
  </div>
  <div class="offer"><div class="pill">حرفان مجاناً</div></div>

  <div class="kids"></div>
  <div class="phone"><img src="../img/exercise.png" alt=""></div>
</body>
</html>
