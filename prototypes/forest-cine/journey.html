<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة الحرف — تجربة</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* تجربة «الفيلم الواحد»: فيديو واحد متصل يتوقّف عند كل وقفة للسؤال ثم يكمل من اللقطة نفسها.
   الحزن والفرح مقطعان بدايتهما ونهايتهما لقطة الوقوف، فيعود الطفل بعدهما إلى وضعه. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#15130c;font-family:'Tajawal',sans-serif;user-select:none}
#stage{position:fixed;left:0;top:0;width:768px;height:1364px;transform-origin:0 0}
#stage video{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#stage .on{opacity:1}

.pad{position:absolute;transform:translate(-50%,-50%) scale(.2);opacity:0;cursor:pointer;
  transition:opacity .5s,transform .7s cubic-bezier(.3,1.5,.5,1),filter .4s}
.pad.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pad svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pad .l{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;direction:rtl;
  font-family:'Noto Naskh Arabic','Amiri',serif;font-weight:700;line-height:1;color:#3b2408;transition:color .4s}
.pad.ok{filter:drop-shadow(0 0 18px rgba(255,236,140,.95)) brightness(1.15)}
.pad.bad{filter:saturate(.25) brightness(.7);cursor:default}
.pad.sink{opacity:0;transform:translate(-50%,-30%) scale(.7)}

/* اللافتة مدمجة بين زرَّي الأعلى كي لا تغطّي قمة الهرم */
#sign{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-16px);opacity:0;z-index:4;
  padding:2px 18px 6px;border-radius:14px;text-align:center;color:#fff1cf;background:linear-gradient(#8a5a2b,#6b421c);
  box-shadow:inset 0 2px 0 #a8713a,inset 0 -3px 0 #4a2c10,0 8px 18px rgba(0,0,0,.45);transition:opacity .5s,transform .5s;pointer-events:none}
#sign.show{opacity:1;transform:translate(-50%,0)}
/* ألوان التطبيق نفسها: --sun #FFD93D (ذهبي)، --green #52C97A / --green-d #2d8653، --red #FF6B6B / --red-d #c73030 */
#sign i{display:block;white-space:nowrap;font:800 12px/1.3 Tajawal;color:#FFD93D;font-style:normal}
#sign .w{display:block;margin-top:20px;font:700 44px/1.2 'Noto Naskh Arabic','Amiri',serif;color:#fffbe8;text-shadow:0 3px 0 #3d250e}
#sign .gap{display:inline-block;min-width:.55em;color:transparent;text-shadow:none;border:3px dashed #FFD93D;border-radius:10px;padding:0 4px;margin:0 3px;transition:color .3s}
/* الشكل الذي نقره الطفل يظهر داخل الكلمة: أحمر إن كان خطأً ثم يختفي، وأخضر إن كان صحيحاً */
#sign .gap.bad{color:#FF6B6B;border:0;padding:0;margin:0;min-width:0;text-shadow:0 3px 0 #c73030,0 0 12px rgba(255,107,107,.7);animation:shake .4s}
#sign .gap.fill{color:#52C97A;border:0;padding:0;margin:0;min-width:0;text-shadow:0 3px 0 #2d8653,0 0 14px rgba(82,201,122,.8)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* معلومة المَعلم: الاسم بذهبي التطبيق (--sun: #FFD93D و--sun-d: #c9a700) */
#info{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-16px);opacity:0;z-index:4;pointer-events:none;
  padding:6px 26px 12px;border-radius:18px;text-align:center;background:rgba(24,14,4,.55);backdrop-filter:blur(4px);transition:opacity .6s,transform .6s}
#info.show{opacity:1;transform:translate(-50%,0)}
#info span{display:block;white-space:nowrap}
/* اسم طويل («الْمَسْجِدُ الْأَقْصَى وَقُبَّةُ الصَّخْرَة») كان يتجاوز عرض الهاتف ⇒ يلتفّ على سطرين */
#info{max-width:calc(100vw - 24px);box-sizing:border-box}
#info .n{white-space:pre-line;width:max-content;max-width:100%;margin:0 auto}
#info .h,#info .p{font:800 20px/1.3 Tajawal;color:#fff3d6;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#info .n{font:700 46px/1.3 'Noto Naskh Arabic','Amiri',serif;color:#FFD93D;text-shadow:0 3px 0 #c9a700,0 5px 10px rgba(0,0,0,.55),0 0 22px rgba(255,217,61,.45)}
/* جملة المثال في أسفل الصفحة، بخلفية داكنة شفافة كمعلومة المَعلم */
#ex{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;z-index:4;pointer-events:none;
  width:min(92vw,560px);padding:12px 20px 14px;border-radius:18px;background:rgba(24,14,4,.62);backdrop-filter:blur(4px);text-align:center;direction:rtl;
  font:700 26px/1.7 'Noto Naskh Arabic','Amiri',serif;color:#fff3d6;text-shadow:0 2px 4px rgba(0,0,0,.6);transition:opacity .5s,transform .5s}
#ex.show{opacity:1;transform:translate(-50%,0)}
#replay{position:fixed;top:max(10px,env(safe-area-inset-top));right:8px;z-index:5;background:#0009;color:#fff;border:0;border-radius:999px;padding:6px 10px;font:800 .85rem Tajawal;cursor:pointer}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,8,3,.72);color:#fff;text-align:center;padding:24px}
.screen h1{font:800 2rem Tajawal} .screen p{font:500 1.05rem Tajawal;opacity:.9}
.screen button{border:0;border-radius:999px;padding:14px 38px;font:800 1.2rem Tajawal;background:#ffb648;color:#3b2408;box-shadow:0 4px 0 #c27d1c;cursor:pointer}
</style>
</head>
<body>
<div id="stage"></div>
<div id="sign"><i></i><span class="w"></span></div>
<div id="info"><span class="h">هُنَا</span><span class="n"></span><span class="p"></span></div>
<div id="ex"></div>
<button id="replay">🔊</button>
<div class="screen" id="start"><h1>🏺 رحلة التراث</h1><p>رحلة حرف الباء: ثلاثة أجزاء، في كل جزء معلمان، وفي كل معلم سؤالان.</p><button>ابدأ</button></div>

<script type="module">
import { ARFORMS, LETTER_BA, LETTER_TA, LETTER_THA, LETTER_ALIF } from '/prototypes/forest-env/data.js';
import { WORD_SENTENCES } from '/prototypes/forest-env/sentences.js';
import { specialPair } from '/prototypes/forest-env/special.js';

/* محرّك «رحلة لكل حرف»: الصفحة واحدة، وكل ما يخصّ الحرف في /prototypes/assets/journeys/<الحرف>.json
   (الفيلم، أزمنة الوقفات، مقاطع الحزن والفرح، مواضع الخيارات، المعالم، استراحات الفصول). الاستعمال: journey.html?l=ب */
const QS = new URLSearchParams(location.search), CH = QS.get('l') || 'ب';
const JD = '/prototypes/assets/journeys/';
const J = await (await fetch(JD + encodeURIComponent(CH) + '.json')).json();
// بيانات كلمات الحرف: في التجربة الباء وحدها مستخرجة من التطبيق؛ في التطبيق تأتي من بيانات الحرف مباشرة
const LETTER = {'ب': LETTER_BA, 'ت': LETTER_TA, 'ث': LETTER_THA, 'ا': LETTER_ALIF}[J.letter];
/* الحروف الستة غير المتصلة (الألف أولاً، 08.11): سؤال واحد في كل وقفة بكلمتين كتمرين التمييز في التطبيق.
   كلمات الرحلة أرقام ثابتة من idWords في ملف الحرف (keys)، والدرس في التطبيق يأخذ الباقي (SPECIAL_JOURNEY_IDX). */
const SPECIAL = J.mode === 'special';

function naturalForm(L, i){ const f = ARFORMS[L[i]], p = L[i-1], pc = p && ARFORMS[p] && ARFORMS[p].c, hn = L[i+1] !== undefined;
  return (pc && hn && f.med) ? 'med' : (pc && f.fin) ? 'fin' : (!pc && hn && f.ini) ? 'ini' : 'iso'; }
const glyphs = (L, d) => L.map((ch, i) => { const f = ARFORMS[ch], m = (d && d[i]) || ''; return (f ? String.fromCodePoint(f[naturalForm(L, i)] || f.iso) : ch) + m; });
const FORM_TXT = {ini: J.letter + 'ـ', med: 'ـ' + J.letter + 'ـ', fin: 'ـ' + J.letter, iso: J.letter};

const [IW, IH] = J.stage;
const SPEED = +QS.get('speed') || J.speed || .85;   // إبطاء الفيلم كله كي يعيش الطفل الطريق
const FADE = 220;                                    // ذوبان قصير يخفي الفرق الصغير بين لقطة الوقوف وطرفَي مقطع الحزن/الفرح
document.getElementById('stage').style.cssText = `width:${IW}px;height:${IH}px`;
document.querySelector('#start h1').textContent = J.title;
document.querySelector('#start p').textContent = `رحلة حرف ${LETTER.name}: ثلاثة أجزاء، في كل جزء معلمان، وفي كل معلم ${SPECIAL ? 'سؤال' : 'سؤالان'}.`;

/* الرحلة ثلاثة أجزاء (معلمان في كل جزء)، وفي التطبيق: 5 جولات ← الجزء 1 ← 5 جولات ← الجزء 2 ← الكتابة ← الجزء 3.
   في كل وقفة سؤالان عن الحرف بكلمتين مختلفتين، ثم الفرح، ثم معلومة المَعلم (اسمه بالذهبي) ثم يكمل الطريق.
   الكلمات: كل كلمات الموضع في المستويات الثلاثة، ما عدا كلمتَي الدرس في مستوى الطفل (lv) والمستبعدة وما سبق استعماله.
   للمبتدئ هذا يساوي «الثالثة من المبتدئ + المستويين الآخرين» — كما في docs/forest-plan.md */
const LVS = LETTER.levels || {}, LV = LVS[QS.get('lv')] ? QS.get('lv') : 'beginner';
// الأجزاء: ?ch=1|2|3 يشغّل جزءاً واحداً (من داخل الدرس)؛ بلا ch تُشغَّل الرحلة كاملة (التجربة المستقلة)
const PART = Math.min(3, Math.max(0, +QS.get('ch') || 0)), EMBED = QS.has('embed');
// نصوص المواضع كما في التطبيق حرفياً (buildRoundsForConnecting) لأن صوت السؤال يقولها، وملف الصوت كما في playQuestionAudio
const POS = {start: ['ini', 'فِي بِدَايَة الْكَلِمَة'], mid_c: ['med_c', 'فِي وَسَط الْكَلِمَة، بَعْدَ حَرْفٍ مُتَّصِل'],
  mid_n: ['med_n', 'فِي وَسَط الْكَلِمَة، بَعْدَ حَرْفٍ مُنْفَصِل'], end_c: ['fin_c', 'فِي آخِر الْكَلِمَة، بَعْدَ حَرْفٍ مُتَّصِل'],
  end_n: ['fin_n', 'فِي آخِر الْكَلِمَة، بَعْدَ حَرْفٍ مُنْفَصِل']};
// موضع الحرف المسؤول عنه والفئة الفعلية من حروف الكلمة — نسخة من targetIndexFor/actualCat في التطبيق
// (بعض الكلمات مُدرجة في الفئة الخطأ، وبعضها فيه الحرف مرتين)
function targetIndexFor(L, cat){
  if (cat === 'start') return L.indexOf(J.letter);
  if (cat.startsWith('end')) return L.lastIndexOf(J.letter);
  const inner = L.map((c, i) => i).filter(i => i > 0 && i < L.length - 1 && L[i] === J.letter);
  const want = cat.endsWith('_c'), pc = i => !!(ARFORMS[L[i-1]] && ARFORMS[L[i-1]].c);
  const m = inner.find(i => pc(i) === want);
  return m !== undefined ? m : (inner.length ? inner[0] : L.indexOf(J.letter));
}
function actualCat(L, i, listed){
  if (listed === 'start' || i <= 0) return listed;
  const prev = ARFORMS[L[i-1]];
  return (i === L.length - 1 ? 'end' : 'mid') + (prev && prev.c ? '_c' : '_n');
}
// كلمات لا تليق بمشهد جميل تُستبعد من الرحلة وحدها (تبقى في الدرس كما هي) — في ملف الحرف: exclude
const lesson = SPECIAL ? new Set() : new Set([...Object.keys(POS).flatMap(k => LVS[LV][k].slice(0, 2)), ...(J.exclude || [])]);
const allOf = key => ['beginner', 'intermediate', 'advanced'].flatMap(lv => LVS[lv][key].map((w, i) => ({w, d: LVS[lv][key + 'D'][i]})));
/* خطة الكلمات للرحلة كلها (6 وقفات × كلمتان) تُختار مرة واحدة في الجزء الأول وتُحفظ، فلا تتكرر كلمة بين الأجزاء
   ولو أُغلق التطبيق بينها. التجربة المستقلة (بلا ch) تختار من جديد في كل مرة. */
const PLAN_KEY = `horofi_journey_plan_${J.letter}_${LV}`;
function makePlan(){ if (SPECIAL) return J.stops.map(s => s.keys.slice());
  const used = new Set();
  return J.stops.map(s => s.keys.map(key => {
    const pool = allOf(key).filter(x => !lesson.has(x.w) && !used.has(x.w));
    const {w} = pool[Math.floor(Math.random() * pool.length)]; used.add(w); return w; })); }
let plan = null;
try { if (PART > 1) plan = JSON.parse(localStorage.getItem(PLAN_KEY) || 'null'); } catch(e){}
if (!Array.isArray(plan) || plan.length !== J.stops.length) plan = makePlan();
try { if (PART) localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch(e){}
function question(w, key){
  if (SPECIAL){ const iw = LETTER.idWords[w], word = iw.letters.join('');
    return {special: true, ...specialPair(iw), g: glyphs(iw.letters, iw.diac), ti: iw.idx, pos: 'اِقْرَأْ وَاخْتَرِ الْكَلِمَةَ الصَّحِيحَة', audio: `/audio/questions/${J.letter}_special.mp3`,
      wordAudio: `/audio/words/${word}.mp3`, sentence: WORD_SENTENCES[word], sentenceAudio: `/audio/sentences/${word}.mp3`}; }
  const {d} = allOf(key).find(x => x.w === w) || {};
  const L = Array.from(w), ti = targetIndexFor(L, key), cat = actualCat(L, ti, key);
  return {g: glyphs(L, d), ti, correct: naturalForm(L, ti), pos: POS[cat][1], audio: `/audio/questions/${J.letter}_${POS[cat][0]}.mp3`, wordAudio: `/audio/words/${w}.mp3`,
    sentence: WORD_SENTENCES[w], sentenceAudio: `/audio/sentences/${w}.mp3`};
}
const ALL = J.stops.map((s, i) => ({...s, pads: s.pads.map(([x, y, r]) => ({x, y, r: r || 88})), qs: s.keys.map((key, j) => question(plan[i][j], key))}));
// الجزء N = الوقفتان 2N-1 و2N، ويبدأ الفيلم من لقطة الوقوف التي انتهى عندها الجزء السابق
const STOPS = PART ? ALL.slice(2*PART - 2, 2*PART) : ALL;
const FROM = PART > 1 ? ALL[2*PART - 3].at : 0;
// ما يحلّ محلّه الدرس في التطبيق الحقيقي بعد كل فصل (شاشة تجريبية في التجربة المستقلة فقط)
// داخل الدرس لا شاشات «هنا في التطبيق…»: هي للعرض التجريبي المستقل فقط
const BREAKS = (PART || EMBED) ? {} : (J.breaks || {});

const PAD_SVG = `<svg viewBox="-100 -100 200 200"><path d="M0 -94 L92 0 L0 94 L-92 0 Z" fill="#e8c98a" stroke="#fff6dc" stroke-width="5"/>
  <path d="M0 -76 L74 0 L0 76 L-74 0 Z" fill="none" stroke="#a9772f" stroke-width="3"/></svg>`;

const stage = document.getElementById('stage'), sign = document.getElementById('sign');
function fit(){ const S = Math.max(innerWidth/IW, innerHeight/IH);
  stage.style.transform = `translate(${(innerWidth - IW*S)/2}px,${(innerHeight - IH*S)/2}px) scale(${S})`; }
addEventListener('resize', fit); fit();

/* على الهاتف: ثلاثة مشغّلات فيديو فقط (الفيلم + الحزن + الفرح). تحميل كل المقاطع معاً كان يجعل أندرويد
   يرفض بعضها (ERR_FAILED على sad_3 في التجربة على الهاتف 08.11) فتعلق الرحلة عند الخطأ.
   مقطعا الوقفة يُحمَّلان حين ينطلق الفيلم نحوها (الطريق 5–10 ث يكفي لتحميلهما من الجهاز).
   poster شفاف يخفي أيقونة التشغيل الرمادية التي يرسمها WebView قبل أول إطار. */
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const mk = src => { const v = document.createElement('video'); Object.assign(v, {muted: true, playsInline: true, preload: 'auto', poster: BLANK});
  if (src){ v.src = JD + src; v.load(); } stage.appendChild(v); return v; };
const film = mk(J.film); film.classList.add('on');
const sadV = mk(), happyV = mk();
function prep(s){ for (const [v, f] of [[sadV, s.sad], [happyV, s.happy]]) if (v.dataset.f !== f){ v.dataset.f = f; v.src = JD + f; v.load(); } }
STOPS.forEach(s => { s.sadV = sadV; s.happyV = happyV; });

const W = ms => new Promise(r => setTimeout(r, ms));
let cur = null;
// الصوت لا يُعلِّق الرحلة أيضاً: سقف = مدة الملف + 1.5 ث (أو 20 ث إن لم تُعرف المدة)
const say = src => new Promise(res => { try{ cur && cur.pause(); }catch(e){} const a = new Audio(src); cur = a;
  let t = setTimeout(res, 20000); a.onloadedmetadata = () => { clearTimeout(t); t = setTimeout(res, ((a.duration || 18) + 1.5) * 1000); };
  a.onended = a.onerror = () => { clearTimeout(t); res(); }; a.play().catch(() => { clearTimeout(t); res(); }); });
const sfx = n => { const a = new Audio(`/prototypes/forest-env/assets/sfx/${n}.mp3`); a.volume = .6; a.play().catch(() => {}); };

// مقطع ردّة الفعل فوق الفيلم المتوقّف: يظهر بذوبان، وعند نهايته يذوب عائداً إلى لقطة الوقوف
// لا تعلق الرحلة أبداً: إن لم يُحمَّل المقطع أو لم يُطلق ended تُكمَل بعد مدته (+ هامش)، وإن فشل التشغيل يُتخطّى
async function react(v){
  try { v.currentTime = 0; } catch(e){}
  const ended = new Promise(r => { v.onended = v.onerror = r; setTimeout(r, ((v.duration || 6) + 2) * 1000); });
  const ok = await v.play().then(() => true, () => false);
  if (!ok){ await W(800); return; }
  await v.animate([{opacity: 0}, {opacity: 1}], {duration: FADE, fill: 'forwards'}).finished;
  await ended;
  await v.animate([{opacity: 1}, {opacity: 0}], {duration: FADE, fill: 'forwards'}).finished;
  v.pause();
}

async function ask(s, q, last){
  sign.querySelector('i').textContent = q.pos;
  sign.querySelector('.w').innerHTML = q.g.map((g, i) => i === q.ti ? `<span class="gap">${g}</span>` : g).join('');
  const others = ['ini', 'med', 'fin', 'iso'].filter(f => f !== q.correct).sort(() => Math.random() - .5).slice(0, 2);
  let locked = true, done;
  const finished = new Promise(r => done = r);
  const nodes = [q.correct, ...others].sort(() => Math.random() - .5).map((form, k) => {
    const p = s.pads[k], e = document.createElement('div'); e.className = 'pad';
    e.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.r*2}px;height:${p.r*2}px`;
    e.innerHTML = PAD_SVG + `<span class="l" style="font-size:${p.r*.78}px">${FORM_TXT[form]}</span>`;
    stage.appendChild(e);
    e.onclick = async () => {
      if (locked || e.classList.contains('bad')) return;
      locked = true;
      if (form === q.correct){
        sfx('correct'); e.classList.add('ok'); sign.querySelector('.gap').classList.add('fill');
        nodes.filter(m => m !== e).forEach(m => m.classList.add('sink'));
        await Promise.all([say(q.wordAudio), W(500).then(() => { e.classList.add('sink'); })]);
        // بعد كل إجابة صحيحة: «أحسنت» ثم جملة المثال في أسفل الصفحة (كما في التطبيق) — طلب المستخدم 07.11
        await say(`/audio/praise/praise_m_${1 + Math.floor(Math.random() * 5)}_full.mp3`);
        sign.classList.remove('show');
        // الاحتفال مرة واحدة بعد السؤال الثاني، وقبل جملة المثال (طلب المستخدم 07.11)
        if (last) await react(s.happyV);
        await example(q);
        if (!last) await W(300);
        nodes.forEach(m => m.remove()); done();
      } else {
        e.classList.add('bad');
        // الشكل الخاطئ يظهر أحمر في مكانه من الكلمة طوال الحزن، ثم يعود الفراغ
        const gap = sign.querySelector('.gap'), right = gap.textContent;
        gap.textContent = String.fromCodePoint(ARFORMS[J.letter][form]) + right.slice(1); gap.classList.add('bad');
        // الخيارات تختفي أثناء الحزن كي لا تغطّي الطفل والطائر، وتعود بعده
        nodes.forEach(m => m.classList.remove('show'));
        await Promise.all([react(s.sadV), W(1000).then(() => say('/audio/wrong/wrong_m_1_full.mp3'))]);
        gap.classList.remove('bad'); gap.textContent = right;
        nodes.forEach(m => m.classList.add('show'));
        locked = false;
      }
    };
    return e;
  });
  document.getElementById('replay').onclick = () => say(q.audio);
  sign.classList.add('show');
  nodes.forEach((e, i) => setTimeout(() => e.classList.add('show'), 500 + i*400));
  await Promise.race([say(q.audio), W(6000)]); await W(300);
  locked = false;
  return finished;
}

/* سؤال الحرف غير المتصل: لوحتان بشكل الرحلات الأخرى نفسه (المعيّن)، على كل منهما كلمة كاملة (الصحيحة والخاطئة)
   كتمرين التمييز في التطبيق، واللافتة فيها الكلمة ومكان الحرف فراغ منقّط (طلب المستخدم 08.11: نفس شكل الرحلات).
   الصحيح: الفراغ يمتلئ أخضر والحرف يتلوّن في اللوحة؛ الخطأ: الفراغ يهتزّ أحمر، اللوحة تبهت والحزن، ثم تعود اللوحتان */
async function askSpecial(s, q, last){
  sign.querySelector('i').textContent = q.pos;
  sign.querySelector('.w').innerHTML = q.g.map((g, i) => i === q.ti ? `<span class="gap">${g}</span>` : g).join('');
  let locked = true, done;
  const finished = new Promise(r => done = r);
  const nodes = [{html: q.correct, ok: true}, {html: q.wrong, ok: false}].sort(() => Math.random() - .5).map((o, k) => {
    const p = s.pads[k], e = document.createElement('div'); e.className = 'pad wide';
    e.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.r*2}px;height:${p.r*2}px`;
    e.innerHTML = PAD_SVG + `<span class="l" style="font-size:${p.r*.56}px">${o.html}</span>`;
    stage.appendChild(e);
    e.onclick = async () => {
      if (locked || e.classList.contains('bad')) return;
      locked = true;
      if (o.ok){
        sfx('correct'); e.classList.add('ok'); sign.querySelector('.gap').classList.add('fill');
        nodes.filter(m => m !== e).forEach(m => m.classList.add('sink'));
        await Promise.all([say(q.wordAudio), W(900).then(() => { e.classList.add('sink'); })]);
        await say(`/audio/praise/praise_m_${1 + Math.floor(Math.random() * 5)}_full.mp3`);
        sign.classList.remove('show');
        if (last) await react(s.happyV);
        await example(q);
        if (!last) await W(300);
        nodes.forEach(m => m.remove()); done();
      } else {
        e.classList.add('bad');
        const gap = sign.querySelector('.gap'); gap.classList.add('bad');
        nodes.forEach(m => m.classList.remove('show'));
        await Promise.all([react(s.sadV), W(1000).then(() => say('/audio/wrong/wrong_m_1_full.mp3'))]);
        gap.classList.remove('bad');
        nodes.forEach(m => m.classList.add('show'));
        locked = false;
      }
    };
    return e;
  });
  document.getElementById('replay').onclick = () => say(q.audio);
  sign.classList.add('show');
  nodes.forEach((e, i) => setTimeout(() => e.classList.add('show'), 500 + i*400));
  await Promise.race([say(q.audio), W(6000)]); await W(300);
  locked = false;
  await finished;
}

// جملة المثال: تظهر في أسفل الصفحة وتُقرأ بصوتها، ثم تختفي
async function example(q){
  if (!q.sentence) return;
  const el = document.getElementById('ex');
  el.textContent = q.sentence; el.classList.add('show');
  await Promise.all([say(q.sentenceAudio), W(2500)]); await W(300);
  el.classList.remove('show'); await W(400);
}

// معلومة المَعلم: «هُنَا [الاسم بالذهبي] فِي [البلد]». صوتها في ملف الحرف (voice)، ويُتخطّى إن لم يُسجَّل بعد
async function info(s){
  const el = document.getElementById('info');
  el.querySelector('.n').textContent = s.name; el.querySelector('.p').textContent = s.place;
  el.classList.add('show');
  await Promise.all([s.voice ? say(s.voice) : null, W(3500)]);
  el.classList.remove('show'); await W(500);
}

// استراحة الفصل: الفيلم واقف على لقطة الوقوف، وفي التطبيق الحقيقي يأتي هنا الدرس
const pauseFor = text => new Promise(r => { const b = document.createElement('div'); b.className = 'screen';
  b.innerHTML = `<p>${text}</p><button>أكمل الرحلة</button>`; document.body.appendChild(b);
  b.querySelector('button').onclick = () => { b.remove(); r(); }; });

// إبلاغ التطبيق (الإطار الأب) بانتهاء الجزء كي يكمل الدرس
const done = () => { try { parent.postMessage({type: 'horofi-journey-done', letter: J.letter, part: PART}, '*'); } catch(e){} };

async function run(){
  film.playbackRate = SPEED;
  if (FROM) film.currentTime = FROM;
  for (const [k, s] of STOPS.entries()){
    prep(s);   // مقطعا الحزن والفرح لهذه الوقفة يُحمَّلان أثناء الطريق
    await film.play().catch(() => {});
    // ينتظر الوصول إلى الوقفة؛ إن توقّف الفيلم من تلقاء نفسه (تقطّع في الشبكة/الذاكرة) يُعاد تشغيله، وإن انتهى أو فشل لا تعلق الرحلة
    await new Promise(res => { const t = () => {
      if (film.currentTime >= s.at || film.ended || film.error) return res();
      if (film.paused && !film.seeking) film.play().catch(() => {});
      requestAnimationFrame(t); }; t(); });
    film.pause(); film.currentTime = s.at;
    for (const [j, q] of s.qs.entries()) await (q.special ? askSpecial : ask)(s, q, j === s.qs.length - 1);
    await info(s);
    if (BREAKS[k]) await pauseFor(BREAKS[k]);
  }
  // الجزءان الأول والثاني ينتهيان والفيلم واقف عند المَعلم الأخير، ويكمل الجزء التالي من هنا
  if (PART && PART < 3){
    if (EMBED) return done();
    return endScreen('أكمل الجزء ' + (PART + 1) + ' ←', () => { const p = new URLSearchParams(location.search); p.set('ch', PART + 1); location.href = location.pathname + '?' + p; });
  }
  await film.play().catch(() => {});
  await new Promise(r => { if (film.ended) return r(); film.onended = film.onerror = r;
    setTimeout(r, (((film.duration || 0) - film.currentTime) / SPEED + 3) * 1000); });
  if (EMBED) return done();
  // إن كان للرحلة رحلة تالية (next في ملف الحرف) نكمل إليها؛ الفيلم التالي يبدأ من آخر لقطة هنا
  if (J.next && !PART){
    const p = new URLSearchParams(location.search); p.set('l', J.next); p.set('cont', '1');
    endScreen('أكمل الرحلة ←', () => { location.href = location.pathname + '?' + p; });
  } else endScreen('أعد التجربة', () => location.reload());
}
function endScreen(label, go){
  const end = document.createElement('div'); end.className = 'screen'; end.style.background = 'none'; end.style.justifyContent = 'flex-end'; end.style.paddingBottom = '60px';
  end.innerHTML = '<button></button>'; end.querySelector('button').textContent = label; document.body.appendChild(end);
  end.querySelector('button').onclick = go;
}
// في الأجزاء 2 و3 تظهر خلف شاشة البداية لقطة الوقوف التي انتهى عندها الجزء السابق
if (FROM){ const seek = () => { film.currentTime = FROM; }; film.readyState >= 1 ? seek() : film.addEventListener('loadedmetadata', seek, {once: true}); }
if (PART){ const st = document.getElementById('start');
  st.querySelector('h1').textContent = `${J.title} — الجزء ${PART}`;
  st.querySelector('p').textContent = PART === 1 ? 'هيّا نبدأ الرحلة!' : PART === 2 ? 'نكمل الطريق إلى مَعلمين جديدين' : 'الجزء الأخير من الرحلة';
  st.querySelector('button').textContent = 'انطلق ←'; }
// إعادة الرحلة كاملة من شاشة نهاية الدرس
if (EMBED && !PART){ const st = document.getElementById('start');
  st.querySelector('p').textContent = 'نعيد الرحلة كاملة!'; st.querySelector('button').textContent = 'انطلق ←'; }
// قادم من الرحلة السابقة: زرّ واحد للإكمال (يبقى ضرورياً لأن المتصفح يطلب لمسة لفتح الصوت في كل صفحة)
if (QS.get('cont')){ const st = document.getElementById('start');
  st.querySelector('p').textContent = 'الرحلة مستمرة: ' + LETTER.name; st.querySelector('button').textContent = 'أكمل ←'; }
// الصوت يُفتح بضغطة «ابدأ» لأن المتصفح يمنعه قبل أي لمسة. صوت الفيلم يتوقف مع توقّفه عند كل سؤال،
// وصوت الحزن والفرح كاملاً (طلب المستخدم 07.11)
document.querySelector('#start button').onclick = () => { document.getElementById('start').remove();
  film.muted = false; STOPS.forEach(s => { for (const v of [s.sadV, s.happyV]){ v.muted = false; v.volume = 1; } });
  run(); };
</script>
